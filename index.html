*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
main{max-width:980px;margin:0 auto;padding:8px}
body.ingame main{max-width:none;padding:6px}
body.ingame h1{display:none}
h1{font-size:18px;margin:4px 0 10px}
button{background:var(--acc);color:#0b1020;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:14px}
button.sub{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
button.sub.newon{background:#2f7bff;color:#fff;border-color:#2f7bff}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:16px}
textarea{height:150px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
label.ck{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sub)}
label.ck input{width:auto}
[hidden]{display:none!important}
.note{font-size:12px;color:var(--sub)}
.dim{color:#7b84a8}
.lk{color:var(--acc);text-decoration:underline;cursor:pointer;font-size:12px}
.warn{background:#3a1d26;border:1px solid var(--bad);border-radius:8px;padding:5px 8px;font-weight:700;font-size:12px}
.tag{background:var(--bad);color:#0b1020;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700}

/* ===== ゲーム画面: 左に縦のステップバー、右に盤面 ===== */
#game{display:block}
#side{background:#171a27;border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:7px;--cur:var(--acc)}
#side.mine{border-color:var(--acc)}
#side.theirs{border-color:var(--bad);--cur:var(--bad)}
#side button{padding:6px 10px;font-size:13px}
#side button.big{padding:10px 8px;font-size:14px;width:100%}
.turnbox{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.turnbox b{font-size:15px}
.turnbox .who{font-weight:800;color:var(--cur)}
.vsteps{display:flex;flex-direction:column;gap:3px;border-left:3px solid var(--line);padding-left:8px}
.vs{font-size:12px;color:#6b7394;padding:2px 6px;border-radius:6px;white-space:nowrap}
.vs .n{margin-right:4px}
.vs.done{color:var(--sub)}
.vs.on{background:var(--cur);color:#0b1020;font-weight:800;font-size:14px;padding:6px 8px;box-shadow:0 0 0 2px #ffffff40}
.vs.on .ar{float:right}
.vs.nxt{border:1px dashed var(--line);text-align:center;font-size:11px;margin-top:2px}
.menu{background:#12141c;border:1px dashed var(--line);border-radius:8px;padding:6px;display:flex;gap:6px;flex-wrap:wrap}
.curstep{font-size:13px;font-weight:800;color:var(--cur);border-bottom:1px solid var(--line);padding-bottom:4px}
.inlog{max-height:38vh;overflow:auto;background:#12141c;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.4;color:var(--sub)}
.inlog div{border-bottom:1px solid #1f2438;padding:1px 0}
.inlog .lt{margin:6px 0 2px;padding:3px 6px;border:0;border-radius:6px;background:#26325c;color:#cfe0ff;font-weight:800;text-align:center;letter-spacing:.04em}
a.cn{color:#ffe08a;text-decoration:underline dotted;cursor:pointer}
.lastlog{font-size:11px;color:var(--sub);line-height:1.35;border-top:1px solid var(--line);padding-top:6px;min-height:2.7em}
#stage{min-width:0;display:flex;flex-direction:column;gap:6px;margin-top:6px}

/* ===== プレイマット(上下対面) ===== */
.ohand{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--sub);padding:0 4px;min-height:calc(var(--cw) * .7 + 4px)}
.mb{width:calc(var(--cw) * .5);height:calc(var(--cw) * .7);flex:0 0 auto;border-radius:4px;border:1px solid #7f90c9;background:#1c2547 var(--back) center/cover no-repeat}
#mat{border:2px solid #8a93ad;border-radius:14px;background:#0c0e14;padding:4px}
.half{display:flex;gap:6px;padding:3px;align-items:stretch;min-height:0}
.half.opp{flex-direction:row-reverse}
.col{display:flex;flex-direction:column;gap:4px;width:calc(var(--cw) * 1.3);flex:0 0 auto;min-height:0}
.half.opp .col{flex-direction:column-reverse}
.field{overflow-x:clip;flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;position:relative;min-height:calc(var(--cw) * 2.8 + 34px);padding:4px;border-radius:10px;background:#a9a9a9;border:1px solid #8a8a8a}
.field .fe{position:absolute;right:10px;bottom:6px}
.lane{display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start;height:calc(var(--cw) * 1.4 + 8px)}
.lane.sp{position:relative;z-index:2}
.half.opp .field{flex-direction:column-reverse}
.half.opp .lane{flex-direction:row-reverse}
.half.me .lane.sp{flex-wrap:wrap-reverse;align-content:flex-end}
.lane.nx{align-content:flex-start}
.midline{height:16px;display:grid;place-items:center;border-top:1px solid #46507a;border-bottom:1px solid #46507a;color:#7b84a8;font-size:10px;letter-spacing:.4em;margin:2px 0}
.zone{background:#1a1e2c;border:1px solid #4a5273;border-radius:8px;padding:3px;display:flex;flex-direction:column;gap:3px;align-items:center;min-height:calc(var(--cw) * 1.05);flex:1;min-width:0}
.zone.drop,.zsub.drop{border-color:var(--acc);background:#202845;cursor:pointer}
.zt{font-size:11px;color:var(--sub)}
.zsub{flex:1;min-width:0;border:1px dashed #3b4263;border-radius:6px;padding:2px;text-align:center;font-size:10px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.subs{display:flex;gap:3px;width:100%;flex:1}
.lks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pile{position:relative;width:calc(var(--cw) * .8);height:calc(var(--cw) * 1.12);margin:auto;cursor:pointer}
.pile.empty{border:1px dashed #3b4263;border-radius:6px;display:grid;place-items:center;font-size:10px;color:var(--sub)}
.pile .card.tface{width:100%;height:100%;pointer-events:none;box-shadow:2px 3px 0 -1px #2a3050,4px 6px 0 -2px #232843}
.pile .pn{position:absolute;right:-4px;bottom:-4px;background:#000c;color:#fff;border:1px solid #7f90c9;border-radius:999px;font-size:11px;font-weight:800;padding:0 6px}
.zone.trash{cursor:pointer;padding-bottom:6px}
.zsub.cores{flex:0 0 auto;padding:3px 2px;min-height:34px}
.lk.rm{align-self:flex-end;font-size:10px;color:var(--sub);opacity:.8}
.deck{flex:0 0 auto;width:calc(var(--cw) * .8);height:calc(var(--cw) * 1.12);align-self:center;border-radius:8px;border:2px solid #7f90c9;background:#1c2547 var(--back) center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#cfd8ff}
.deck b{font-size:16px;color:#fff;background:#000b;border-radius:6px;padding:0 7px}.deck span{background:#000b;border-radius:6px;padding:0 5px;margin-top:2px}
.deck[data-deck]{cursor:pointer;outline:2px dashed var(--ok);outline-offset:-4px}

/* ===== コア(通常コアは数字、ソウルコアは個別) ===== */

.cc{min-width:30px;height:33px;background:var(--hex) center/100% 100% no-repeat;color:#05304f;font-weight:900;display:inline-grid;place-items:center;padding:0 3px;border:0;font-size:13px;text-shadow:0 1px 0 #ffffffb0;filter:drop-shadow(0 1px 2px #0009)}
.cc.own,.core.own{cursor:grab}
.cc.sel,.core.sel,.tok.sel{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px var(--ok)) drop-shadow(0 0 5px var(--ok))}
.cc.zero{opacity:.35;filter:grayscale(1)}
.symi,.souli,.symp{display:inline-block;width:1.15em;height:1.15em;background:var(--symred) center/contain no-repeat;vertical-align:-.22em}.souli{background-image:var(--pent)}.symp{background-image:var(--sympurple)}.symb{display:inline-block;width:1.15em;height:1.15em;background:var(--symblue) center/contain no-repeat;vertical-align:-.22em}.symy{display:inline-block;width:1.15em;height:1.15em;background:var(--symyellow) center/contain no-repeat;vertical-align:-.22em}.symw{display:inline-block;width:1.15em;height:1.15em;background:var(--symwhite) center/contain no-repeat;vertical-align:-.22em}.symg{display:inline-block;width:1.15em;height:1.15em;background:var(--symgreen) center/contain no-repeat;vertical-align:-.22em}.cardbox.tapped.heavy{width:var(--cw)}.cardbox.tapped.heavy .card{transform:translate(-50%,-50%) rotate(180deg)}.cardbox.heavy::after{content:'重疲労';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000d;color:#ffd34d;border:1px solid #ffd34d;border-radius:6px;padding:0 4px;font-size:10px;font-weight:900;z-index:5;pointer-events:none;white-space:nowrap}.heavyb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000c;color:#ffd34d;border:1px solid #ffd34d;border-radius:6px;padding:0 4px;font-size:10px;font-weight:900;z-index:5;pointer-events:none;white-space:nowrap}
.cscore{pointer-events:auto;width:46px;height:46px;display:inline-block;background:var(--hex) center/contain no-repeat;cursor:pointer;transition:transform .12s,filter .12s;margin:3px}.cscore.soul{background-image:var(--pent)}.cscore.on{transform:translateY(-8px) scale(1.08);filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 7px #ff5a5a)}
.cmini{display:inline-block;width:1.3em;height:1.3em;background:var(--hex) center/contain no-repeat;vertical-align:-.3em;margin-right:2px}.cmini.soul{background-image:var(--pent)}
.csrow{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;padding:6px 0}.csinfo{font-size:12px;text-align:center;opacity:.9}
.cardglow{position:fixed;z-index:9998;pointer-events:none;transform:translate(-50%,-50%);border-radius:10px;border:3px solid #fff6b0;box-shadow:0 0 18px 6px #7fd6ffcc,0 0 34px 12px #7fd6ff77;animation:cglow 1.8s ease-in-out forwards}
@keyframes cglow{0%{opacity:0}20%{opacity:1}45%{opacity:.45}70%{opacity:1}100%{opacity:0}}
.barrier.sm{width:76px;height:76px;margin:-38px 0 0 -38px;border-width:3px}
.lifeglow{position:fixed;z-index:9999;pointer-events:none;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,#fff6b0cc,#ffd34e77 45%,transparent 72%);box-shadow:0 0 30px 12px #ffd34eaa;animation:lglow 2.2s ease-in-out forwards}
@keyframes lglow{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.05)}50%{opacity:.5;transform:scale(.9)}75%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
.barrier{position:fixed;z-index:9999;pointer-events:none;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;border:4px solid #7fd6ff;box-shadow:0 0 22px 8px #7fd6ffaa,inset 0 0 24px 6px #bfeaff88;background:radial-gradient(circle,#bfeaff33,#3aa0ff22 60%,transparent 70%);animation:barr 1.9s ease-out forwards}
@keyframes barr{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.25);opacity:0}}
.core{width:34px;height:34px;background:var(--pent) center/100% 100% no-repeat;display:inline-block;font-size:0;color:transparent;filter:drop-shadow(0 1px 2px #0009)}
.core.pay{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px var(--paycol)) drop-shadow(0 0 5px var(--paycol))}
.core.plc{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #6ea8ff) drop-shadow(0 0 5px #6ea8ff)}
.tg{font-style:normal;font-size:11px;font-weight:800;border-radius:6px;padding:0 4px;color:#0b1020}
.tg.p{background:var(--paycol)}
.tg.l{background:#6ea8ff}

/* ===== カード(縦長長方形) ===== */
.card{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4);border:2px solid var(--cc,#6a7499);border-radius:6px;background:#232840;padding:2px 3px;font-size:clamp(8px,2.4vw,11px);line-height:1.15;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden;flex:0 0 auto}
.card,.cc,.core{-webkit-user-select:none;user-select:none;touch-action:none}
.handrow .card{touch-action:none;cursor:grab;-webkit-touch-callout:none}
.card .cost{align-self:flex-start;background:var(--cc,#6a7499);color:#0b1020;border-radius:50%;min-width:1.6em;height:1.6em;display:grid;place-items:center;font-weight:800;padding:0 2px}
.card .nm{font-weight:700;word-break:break-all;overflow:hidden;max-height:3.6em}
.card .lw{font-weight:700;color:var(--gold);text-align:right}
.lvb{display:inline-block;border-radius:5px;padding:0 4px;font-weight:800;color:#fff;background:#3b7be0}
.lvk2 .lvb{background:#f0a020;color:#2a1c00}
.lvks .lvb{background:linear-gradient(#d65cff,#7a3cf0)}
.row.r1{flex-wrap:nowrap;gap:4px}#side .row.r1>button{padding:7px 4px !important;font-size:11px !important;white-space:nowrap;flex:1 1 auto !important;min-width:0}
.lvb{white-space:nowrap}.lvb.shin{margin-left:2px;font-size:.66em;letter-spacing:-.03em;padding:0 3px}
#me.turnglow,#opp.turnglow{position:relative;isolation:isolate}
#me.turnglow::after,#opp.turnglow::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:6;mix-blend-mode:screen;animation:tglow 2.4s ease-in-out both}
@keyframes tglow{0%{box-shadow:inset 0 0 0 0 #7fa8ff00,0 0 0 0 #7fa8ff00;background:#7fa8ff00}40%{box-shadow:inset 0 0 40px 10px #7fa8ffcc,0 0 24px 4px #7fa8ff99;background:#7fa8ff1c}100%{box-shadow:inset 0 0 0 0 #7fa8ff00,0 0 0 0 #7fa8ff00;background:#7fa8ff00}}
.cardbox.lvk2 .card{outline:2px solid #f0a020;outline-offset:0}
.cardbox.lvks .card{outline:3px solid #c04df0;outline-offset:0}
.bp.up{color:#7dffb0;text-shadow:0 0 6px #2ecf7a}.bp.dn{color:#ff8c97}
.bpnote{color:#7dffb0}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px}
.sin{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.sin>.cores{position:absolute;left:0;right:0;top:calc(var(--cw) * .5);z-index:3;gap:1px;pointer-events:none}
.sin>.cores>*{pointer-events:auto}
.sin>.cores .cc{min-width:calc(var(--cw) * .27);height:calc(var(--cw) * .29);font-size:calc(var(--cw) * .12);padding:0 2px}
.sin>.cores .souli,.sin>.cores .core{transform:scale(.85)}.sin.opp{transform:rotate(180deg)}
.cardbox{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4);flex:0 0 auto}
.cardbox.tapped{width:var(--cw)}   /* 横向きでも場所を取らない(アタックで隣のカードが詰めたり動いたりしないように) */
.cardbox .card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.cardbox.tapped .card{transform:translate(-50%,-50%) rotate(90deg);opacity:.8}
.handbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.hn{font-size:12px;color:var(--sub);margin-bottom:3px}
.handrow{--cw:calc(var(--cwb) * .66);display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:3px;min-height:calc(var(--cw) * 1.4 + 4px)}
.lrow{display:flex;gap:6px;flex-wrap:wrap}

/* ===== ドラッグ ===== */
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:.92;transform:translate(-50%,-55%);filter:drop-shadow(0 6px 10px #000a)}
.ghost .card{cursor:grabbing}
body.dragging,body.dragging *{cursor:grabbing!important}
.tgt{outline:2px dashed #4d6fb8!important;outline-offset:-3px}
.hot{outline:3px solid var(--ok)!important;outline-offset:-3px;background:#1d3a2b!important}

/* ===== コスト支払いパネル ===== */
.pay{background:#1b2230;border:2px solid var(--paycol);border-radius:10px;padding:7px;font-size:12px;display:flex;flex-direction:column;gap:5px}
.pay.ok{--paycol:var(--ok);background:#18291f}
.pay.bad{--paycol:var(--bad);background:#2d1a20}
.pay.need{--paycol:var(--warn)}
.pay .pt{font-weight:800;font-size:13px}
.pay .pl{line-height:1.35}
.pay .msg{font-weight:800;color:var(--paycol)}
.pay .tabs{display:flex;gap:4px}
.pay .tab{flex:1;padding:5px 4px;font-size:12px;background:var(--panel);color:var(--fg);border:2px solid var(--line)}
.pay .tab.on{border-color:var(--paycol);background:#232b3e}
.pay .tab.ok{color:var(--ok)}
.pay .tab.bad{color:var(--bad)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:3px 7px;font-size:11px}
.chip.on{border-color:var(--paycol);background:#2a3350}

/* ===== ログ・通知 ===== */
#logpanel{display:none !important;position:fixed;right:10px;bottom:10px;width:min(360px,calc(100vw - 20px));max-height:46vh;overflow:auto;z-index:30;background:#171a27;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--sub);box-shadow:0 8px 24px #000a}
#logpanel .lh{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--fg);font-weight:700}
#banner{position:fixed;left:50%;top:10px;transform:translateX(-50%);width:min(440px,calc(100vw - 20px));z-index:35;background:#2a1f2a;border:2px solid var(--bad);border-radius:12px;padding:8px 10px;max-height:60vh;overflow:auto;box-shadow:0 8px 24px #000a}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#000d;border:1px solid var(--line);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;max-width:90vw}

/* ===== ライフ(コア素材を上3・下2で表示) ===== */
.lifegrid{display:grid;grid-template-columns:repeat(3,var(--lc));gap:3px;justify-content:start;align-content:start;padding:2px;--lc:calc(var(--cw) * .42)}
.half.opp .lifegrid{transform:rotate(180deg)}
.lc{width:var(--lc);height:var(--lc);display:block}
.lc svg{width:100%;height:100%;display:block;pointer-events:none}
.lc.own{cursor:grab;touch-action:none}
.lc.sel{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px var(--ok))}
.lifegrid.empty{display:block;color:#6b7394;font-size:11px}
.vs.skip{text-decoration:line-through;opacity:.45}
.atk{outline:3px solid var(--bad);outline-offset:2px;border-radius:8px}
.cardbox.atking::after{content:'ATTACK';position:absolute;left:50%;top:-4px;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:9px;font-weight:800;padding:0 5px;border-radius:6px;z-index:2}
/* ===== フラッシュ・ブロックの案内、光る枠 ===== */
#prompt{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;background:#2a2410;border:2px solid #ffd34d;border-radius:10px;padding:6px 10px;font-size:13px}
#prompt.wait{background:#1a1e2c;border-color:#4a5273;color:var(--sub)}
#prompt b.hl{color:#ffd34d}
.camoh{margin:6px auto;padding:6px 12px;max-width:560px;border:1px solid #b98cff;border-radius:10px;background:rgba(60,30,110,.92);color:#fff;font-size:12.5px;line-height:1.5;text-align:center;pointer-events:none}
.camoh.ok{border-color:#5be38a;background:rgba(20,90,50,.92)}
.cardbox.nxsp .card{outline:3px solid #46e6ff !important;box-shadow:0 0 0 4px rgba(70,230,255,.35),0 0 20px 6px #46e6ff;animation:nxglow 1.6s ease-in-out infinite}
.cardbox.nxsp::before{content:'NEXUS→SPIRIT';position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);background:linear-gradient(90deg,#1fb5d9,#8a5cff);color:#fff;font-size:8px;font-weight:800;padding:0 4px;border-radius:6px;z-index:3;white-space:nowrap}
@keyframes nxglow{0%,100%{box-shadow:0 0 0 4px rgba(70,230,255,.25),0 0 12px 3px #46e6ff}50%{box-shadow:0 0 0 5px rgba(138,92,255,.45),0 0 26px 9px #8a5cff}}
#prompt .sp{flex:1}
.glow{box-shadow:0 0 0 3px #ffe066,0 0 16px 5px #ffd34daa !important;animation:pulse 1s ease-in-out infinite;cursor:pointer}
@keyframes pulse{50%{box-shadow:0 0 0 3px #fff3a0,0 0 26px 9px #ffd34d !important}}
.cardbox .card.picked,.card.picked{outline:4px solid #fff !important;outline-offset:1px;box-shadow:0 0 0 7px var(--ok),0 0 22px 8px #2ee08a !important;z-index:3}
.card.picked::before{content:'✔';position:absolute;right:2px;top:2px;background:var(--ok);color:#06210f;font-weight:900;font-size:12px;border-radius:50%;width:1.5em;height:1.5em;display:grid;place-items:center;z-index:4}
@keyframes bw{from{width:calc(var(--cw) * 1.4)}to{width:var(--cw)}}
.cardbox.untapping{animation:none !important}
.card.hasart{background-size:cover;background-position:center;padding:0}
.card.hasart .cost,.card.hasart .nm{display:none}
.card.hasart .lw{position:absolute;left:0;right:0;bottom:0;background:#000b;color:var(--gold);padding:0 2px;text-align:center;font-size:.95em}

.cardbox.blking::after{content:'BLOCK';position:absolute;left:50%;top:-4px;transform:translateX(-50%);background:#3b7be0;color:#fff;font-size:9px;font-weight:800;padding:0 5px;border-radius:6px;z-index:2}
.card.buff .lw{color:#7dffb0}
#mat{position:relative}
#cbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#cbtn[hidden]{display:none}
#cbtn button{pointer-events:auto;font-size:clamp(18px,2.4vw,28px);font-weight:900;padding:12px 44px;border-radius:999px;border:3px solid #fff3a0;background:linear-gradient(#ffd34d,#e8a100);color:#2a1c00;box-shadow:0 0 0 4px #ffd34d55,0 10px 30px #000c;animation:bigpulse 1.2s ease-in-out infinite;letter-spacing:.2em}
#cbtn button.sec{font-size:16px;letter-spacing:0;padding:8px 22px;background:#2a3350;color:#fff;border-color:#8fa0d6;animation:none}
#cbtn button:disabled{opacity:.45;animation:none}
#cbtn .row2{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#cbtn small{background:#000b;color:#ffe9a8;padding:2px 10px;border-radius:999px;font-size:12px}
@keyframes bigpulse{50%{box-shadow:0 0 0 12px #ffd34d44,0 10px 30px #000c}}
/* 効果の発動表示(画面中央) */
#fx{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:45;pointer-events:none;width:min(560px,92vw)}
.fxc{pointer-events:auto;cursor:pointer}
.fxc.pend{opacity:.96;padding:10px 16px}.fxc.pend .fxt{font-size:16px}
#fx.compact .fxc{padding:5px 10px;border-width:2px}#fx.compact .fxn{font-size:12px}#fx.compact .fxt{font-size:11px!important;line-height:1.25}
#fx[hidden]{display:none}
.fxc{background:linear-gradient(#2b2540,#1a1730);border:3px solid #ffd34d;border-radius:16px;padding:14px 20px;text-align:center;box-shadow:0 0 0 6px #ffd34d33,0 16px 50px #000d;animation:fxin .35s ease-out both}
.fxc.fail{border-color:#8a93ad;box-shadow:0 16px 50px #000d}
.fxn{font-size:13px;color:#ffd34d;font-weight:800;letter-spacing:.1em}
.fxt{font-size:19px;font-weight:800;margin:6px 0;line-height:1.5}
.fxr{font-size:15px;color:#9dffc2;font-weight:700}
.fxc.fail .fxr{color:#c4cbe8}
@keyframes fxin{from{opacity:0;transform:scale(.8) translateY(14px)}to{opacity:1;transform:none}}
/* ドロー・回復・コアの動き */
@keyframes summonin{0%{opacity:0;transform:translateY(var(--sy,38vh)) scale(.55)}55%{opacity:1;transform:translateY(0) scale(1.15);filter:drop-shadow(0 0 20px #ffd24a) brightness(1.5)}100%{opacity:1;transform:none;filter:none}}
@keyframes summonring{0%{opacity:0;transform:scale(.7)}45%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.slot.summonin{position:relative;animation:summonin 1.1s cubic-bezier(.2,.8,.3,1) both;z-index:6}
.slot.summonin::after{content:'';position:absolute;left:-6px;right:-6px;top:-6px;bottom:-6px;border:4px solid #ffd24a;border-radius:12px;box-shadow:0 0 22px 6px #ffd24a;pointer-events:none;animation:summonring 1.1s ease-out both;animation-delay:inherit}
@keyframes drawin{0%{opacity:0;transform:translateY(-260px) scale(.4) rotate(-12deg)}55%{opacity:1}80%{transform:translateY(8px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes drawin2{0%{opacity:0;transform:translateY(-64px)}100%{opacity:1;transform:none}}
.drawin{animation:drawin2 .9s ease-out both !important}
.shard{position:fixed;z-index:70;pointer-events:none;border:2px solid var(--cc);border-radius:7px;background:linear-gradient(160deg,#2a3150,#161a2a);color:#fff;font-size:11px;font-weight:700;padding:5px;box-sizing:border-box;line-height:1.2}
.crack{position:fixed;z-index:71;pointer-events:none}
.part{position:fixed;z-index:70;pointer-events:none;width:8px;height:8px;border-radius:50%;left:0;top:0}
.ring{position:fixed;z-index:70;pointer-events:none;width:26px;height:26px;border-radius:50%;border:3px solid #9fd4ff;left:0;top:0}
.lifetxt{position:fixed;z-index:72;pointer-events:none;font-weight:900;font-size:24px;color:#fff;text-shadow:0 0 8px #e5555f,0 2px 6px #000;left:0;top:0}
.warnl{background:#3a2418;border:1px solid #ff9a5a;border-radius:6px;padding:2px 6px;color:#ffc99d}
@keyframes tapin{from{transform:translate(-50%,-50%) rotate(0);opacity:1}to{transform:translate(-50%,-50%) rotate(90deg);opacity:.8}}
@keyframes tapw{from{width:var(--cw)}to{width:calc(var(--cw) * 1.4)}}
.cardbox .card.tapin{animation:tapin .6s ease-in-out both !important}.cardbox.tapping{animation:none !important}
@keyframes untap{from{transform:translate(-50%,-50%) rotate(90deg)}to{transform:translate(-50%,-50%) rotate(0)}}
.cardbox .card.untap{animation:untap 1s ease-in-out both !important}
@keyframes popc{50%{transform:scale(1.35);filter:brightness(1.5)}}
.cores.pop{animation:popc .5s ease-out both}
.fly{position:fixed;z-index:60;width:24px;height:26px;background:var(--hex) center/100% 100% no-repeat;pointer-events:none;left:0;top:0}.fly.soul{width:30px;height:30px;background-image:var(--pent)}
.chip.soulc{border-color:var(--gold)}
/* ===== コスト支払いポップアップ(手札の位置・中央) ===== */
.paywrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.6fr) auto;gap:10px;align-items:stretch;max-width:1000px;margin:0 auto;background:#1b2230;border:2px solid var(--paycol);border-radius:12px;padding:8px 10px;font-size:12px;min-height:calc(var(--cw) * 1.4 + 14px);box-shadow:0 0 18px #0009}
.paywrap.ok{border-color:var(--ok)}.paywrap.bad{border-color:var(--bad)}
.paywrap .pt{font-weight:800;font-size:14px}
.paywrap .pc{display:flex;flex-direction:column;gap:3px;min-width:0}
.paywrap .msg{font-weight:800;color:var(--paycol)}
.paywrap.ok .msg{color:var(--ok)}.paywrap.bad .msg{color:var(--bad)}
.pzs{display:flex;gap:8px}
.exh{font-size:11px;color:var(--sub);margin-top:2px}
.pfx{background:#0006;border:1px solid #fff3;border-radius:8px;padding:6px 8px;margin:4px 0;font-size:12px;line-height:1.5;text-align:left;position:relative}.pfx .pdet{float:right;margin:0 0 4px 8px;padding:3px 10px;font-size:11px}
.exrow{display:flex;flex-wrap:wrap;gap:4px;max-height:calc(var(--cw) * 1.1);overflow:auto;padding:2px}
.exc{width:calc(var(--cw) * .62);height:calc(var(--cw) * .86);flex:0 0 auto;border:2px solid var(--cc,#6a7499);border-radius:5px;background:#232840;padding:2px;font-size:9px;line-height:1.15;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden;opacity:.7}
.exc b{overflow:hidden;max-height:3.4em;word-break:break-all}.exc span{color:var(--sub)}.exc em{font-style:normal;color:var(--sub);font-size:8px}
.exc.hasart{width:calc(var(--cw) * .9);height:calc(var(--cw) * 1.25);background-size:cover;background-position:center;padding:0}.exc.hasart b,.exc.hasart span,.exc.hasart em{display:none}
.exc.on{opacity:1;outline:3px solid #ffd24a;transform:translateY(-3px);background-color:#3a3320}
.pz{flex:1;min-width:0;border:2px dashed #5a648c;border-radius:10px;padding:4px 6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;background:#141824}
.pz.on{border-style:solid;border-color:var(--paycol)}
.pz.ok{border-color:var(--ok);background:#14261d}.pz.bad{border-color:var(--bad);background:#2a1618}
.pz.tgt{background:#222c4a}.pz.hot{outline:3px solid #fff;background:#2c3960}
.pz .pzt{font-size:11px;color:var(--sub)}
.toks{display:flex;gap:4px;flex-wrap:wrap;min-height:26px;align-content:flex-start}
.tok{width:27px;height:30px;background:var(--hex) center/100% 100% no-repeat;display:grid;place-items:center;font-size:0;color:transparent;cursor:pointer;filter:drop-shadow(0 1px 2px #0009)}
.tok.soul{width:32px;height:32px;background-image:var(--pent)}
.paywrap .bt{display:flex;flex-direction:column;gap:4px;justify-content:center}
.paywrap .bt button{padding:6px 12px}
.ticker{font-size:12px;color:#ffe9a8;min-height:1.4em;background:#2a2410;border-radius:6px;padding:2px 6px}
/* ===== カード詳細シート ===== */
.cd{display:grid;grid-template-columns:min(38%,250px) 1fr;gap:12px;align-items:start}
.cd .art{aspect-ratio:5/7;border-radius:8px;overflow:hidden;border:2px solid var(--cc,#6a7499);background:#10131c}

<script src="cards/cards-data.js"></script>
<script src="cards/art-extra-1.js" onerror="void 0"></script><script src="cards/art-extra-2.js" onerror="void 0"></script>
</head>
<body>
<main>
<h1>バトスピ練習サイト</h1>

<section id="lobby">
  <select id="first" hidden><option value="choose" selected>choose</option><option value="random">random</option><option value="host">host</option><option value="guest">guest</option></select>
  <input type="checkbox" id="mullOn" checked hidden>
  <div class="box b-name">
    <h2>プレイヤー名</h2>
    <div class="row"><input id="myName" placeholder="名前を入力(最大12文字)" maxlength="12" autocomplete="off" style="max-width:220px"></div>
  </div>
  <div class="box b-deck">
    <h2>使うデッキを選ぶ</h2>
    <p class="note">サンプル以外の自作デッキはキャッシュに保存されます。急な削除が不安な場合は、デッキを書き出して文字列を保管してください。ふっかつのじゅもんです。</p>
    <select id="lobbyDeck" hidden></select>
    <div class="row" style="margin:8px 0"><button id="bBuilder">デッキ作成</button></div>
    <div id="deckPick" class="dpick"></div>
    <p class="note" id="lobbyDeckNote"></p>
    <div id="lobbyDeckList" class="ldl"></div>
    <textarea id="deckText" hidden></textarea>
    <input type="checkbox" id="fillDummy" hidden>
  </div>
  <div class="box b-net">
    <h2>対戦する</h2>
    <p class="note">同じ合言葉を入力した2人が自動でマッチングします。ランダムで選ばれた側が、先攻・後攻を選びます。</p>
    <input id="pass" placeholder="合言葉(4文字以上)" maxlength="30" autocomplete="off" style="margin:8px 0">
    <div class="row"><button id="bMatch">対戦開始</button></div>
    <div id="conn" style="margin-top:8px;font-size:13px;color:var(--sub)"></div>
  </div>
  <div class="box b-cpu">
    <h2>CPUと対戦する</h2>
    <div class="row">
      <button id="bCpu">CPU対戦を始める</button>
      <label class="ck" style="display:none">CPUの強さ <select id="cpuLv"><option value="strong">強い</option></select></label>
      <label class="ck">CPUのデッキ <select id="cpuDeck" style="width:auto;min-width:170px"></select></label>
      <label class="ck dev-only"><input type="checkbox" id="testModeCpu">テストモード(デッキサーチを有効にする)</label>
    </div>
  </div>
  <div class="box b-solo dev-only">
    <h2>ソロテスト(1台で両側を操作)</h2>
    <p class="note">1人で両方のプレイヤーを操作して、カードの動きを試せます。流れは対戦と同じです。</p>
    <div class="row">
      <button id="bSolo">ソロテストを始める</button>
      <label class="ck">相手側のデッキ <select id="soloDeck" style="width:auto;min-width:170px"></select></label>
      <label class="ck"><input type="checkbox" id="testMode" checked>テストモード(デッキサーチを有効にする)</label>
    </div>
  </div>
  <div class="box b-dev" style="display:none">
    <div id="devOff" class="row"><input id="devPass" type="password" placeholder="開発者パス" autocomplete="off" style="width:150px;font-size:13px;padding:5px"><button id="devGo" class="sub" style="padding:5px 12px;font-size:12px">開発者モード</button></div>
    <div id="devOn" class="row" hidden><span class="note">開発者モード中(テスト用の項目が表示されています)</span><button id="devEnd" class="sub" style="padding:5px 12px;font-size:12px">終了</button></div>
  </div>
</section>

<section id="builder" hidden data-tab="pool">
  <div class="bhead">
    <b>デッキ作成</b>
    <input id="bName" placeholder="デッキ名" maxlength="30" style="width:150px;font-size:14px;padding:6px">
    <span id="bCover" class="bcover" title="デッキ一覧に表示される表紙カード(デッキ内のカードの★で変更)">表紙</span>
    <select id="bSaved" style="display:none"></select>
    <button id="bSave">保存</button><button id="bNew" style="display:none"></button><button id="bDel" style="display:none"></button>
    <span class="sp"></span>
    <button id="bUse">このデッキで対戦へ</button><button id="bClose" class="sub">戻る</button>
  </div>
  <div class="btabs"><button data-btab="pool" class="on">カード一覧</button><button data-btab="deck">デッキ <b id="bCount2">0</b>枚</button></div>
  <div class="bbody">
    <div class="bpool">
      <div class="bfilters">
        <input id="bQ" placeholder="検索(名前・ID・系統・効果)" style="flex:1 1 160px;font-size:14px;padding:6px">
        <select id="bColor"><option value="">色</option><option value="red">赤</option><option value="purple">紫</option><option value="green">緑</option><option value="white">白</option><option value="yellow">黄</option><option value="blue">青</option></select>
        <select id="bType"><option value="">種別</option><option value="spirit">スピリット</option><option value="nexus">ネクサス</option><option value="magic">マジック</option></select>
        <select id="bCost"><option value="">コスト</option></select>
        <select id="bSet"><option value="">収録</option></select>
        <label class="ck" style="font-size:12px"><input type="checkbox" id="bEx" style="width:auto">EX</label>
      </div>
      <div class="bpackrow"><span id="bPackInfo" class="note"></span>
        <button id="bImport" class="sub">カードフォルダを読み込む</button><input type="file" id="bFolder" webkitdirectory multiple hidden></div>
      <div id="bGrid" class="bgrid"></div>
    </div>
    <div class="bdeck" id="bDeckPane">
      <div id="bStats"></div>
      <div id="bList" class="blist"></div>
      <div class="row" style="margin-top:6px"><button id="bExport" class="sub">デッキを書き出す</button><button id="bImportJson" class="sub">デッキを取り込む</button></div>
    </div>
  </div>
</section>

<section id="game" hidden>
  <aside id="side"></aside>
  <div id="stage">
    <div id="oppHand" class="ohand"></div>
    <div id="mat">
      <div id="opp" class="half opp"></div>
      <div class="midline">FIELD</div>
      <div id="cbtn" hidden></div>
      <div id="mullbox" hidden></div>
      <div id="endbtn" hidden></div>
      <div id="me" class="half me"></div>
    </div>
    <div id="prompt" hidden></div>
    <div id="hand" class="handbox"></div>
  </div>
  <div id="fx" hidden></div>
  <div id="result" hidden></div>
  <div id="cutin" hidden></div>
  <div id="gate" hidden><div class="gt">ゲートオープン、界放</div></div>
  <div id="logpanel" hidden></div>
  <div id="banner" hidden></div>
  <div id="toast" hidden></div>
</section>
</main>

<script id="engine">
/* ================= エンジン(DOMに依存しない) ================= */
const STEPS = ['start','core','draw','refresh','main','attack','main2','end'];
const STEP_JP = { start:'スタート', core:'コア', draw:'ドロー', refresh:'リフレッシュ', main:'メイン', attack:'アタック', main2:'第二メイン', end:'エンド' };
const AUTO = new Set(['start','core','draw','refresh']);
const TYPES = ['spirit','nexus','magic'];
const TYPE_JP = { spirit:'スピリット', nexus:'ネクサス', magic:'マジック' };

let _id = 1;
const nid = p => p + (_id++);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const mkCore = soul => ({ id: nid('c'), soul: !!soul });
const mkInst = def => ({ iid: nid('k'), def, cores: [], tapped: false });

/* --- カードデータの検証・整形(相手から届くデータも必ず通す) --- */
const str = (v, n) => String(v == null ? '' : v).slice(0, n);
const int = (v, lo, hi, df = 0) => { v = Math.floor(Number(v)); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : df; };
// 小さなJSONだけを通す(大きさ制限つき)
const jd = (v, n) => { try { const t = JSON.stringify(v); return t && t.length <= n ? JSON.parse(t) : null; } catch (e) { return null; } };
function cleanEffect(e) {
  e = e && typeof e === 'object' ? e : {};
  const t = e.timing && typeof e.timing === 'object' ? e.timing : {};
  return {
    levels: Array.isArray(e.levels) ? e.levels.slice(0, 3).map(x => int(x, 1, 3, 1)) : [], // 空なら全レベルで有効
    shinkai: !!e.shinkai,
    timing: { kind: str(t.kind, 12), when: str(t.when, 24), event: str(t.event, 24), step: str(t.step, 12), turn: str(t.turn, 8), of: str(t.of, 8), label: str(t.label, 80), limit: str(t.limit, 8), nodup: !!t.nodup, flt: t.flt && typeof t.flt === 'object' ? jd(t.flt, 200) : null },
    keyword: str(e.keyword, 20),
    cond: e.cond && typeof e.cond === 'object' ? jd(e.cond, 400) : null,

const artOf = id => { const v = VARIANTS.find(x => x.id === id); return ART_EMBED[id] || ART_URL[id] || (v ? (ART_EMBED[v.of] || ART_URL[v.of] || '') : ''); };

const cardAttr = (k, own, zone) => 'style="--cc:' + (COLOR_HEX[k.def.color] || '#6a7499') + (artOf(k.def.id) ? ';background-image:url(' + artOf(k.def.id) + ')' : '') + '" data-card="' + k.iid + '" data-zone="' + zone + '" data-own="' + (own ? 1 : 0) + '"';

// 場のカード(縦長・疲労で横向き・下にコア表示)
// レベルの色分け: Lv1=青 / Lv2=橙 / 真界放(ソウルコアでLv2)=紫
function lvKind(k) {
  const li = lvInfo(k); if (!li) return '';
  if (li.lv >= 2 && k.def.keywords.includes('shinkai') && k.cores.some(c => c.soul) && k.cores.length < li.core) return 's';
  return li.lv >= 2 ? '2' : '1';
}
function fieldCardHTML(k, own) {
  const d = k.def, li = lvInfo(k);
  const bp = li && V.bps && V.bps[k.iid] != null ? V.bps[k.iid] : (li ? li.bp : 0);
  const kind = lvKind(k), lvb = li ? '<span class="lvb">Lv' + li.lv + '</span>' + (kind === 's' ? '<span class="lvb shin">真界放</span>' : '') : '';
  const bpc = li && bp > li.bp ? 'up' : li && bp < li.bp ? 'dn' : '';
  const sx = (k.symx || []).reduce((n, x) => n + x.n, 0) + ((V.symDyn || {})[k.iid] || 0), sxb = sx ? '<br><span class="symx">シンボル+' + sx + '</span>' : '';
  const low = d.type === 'spirit' ? (li ? lvb + sxb + '<br><span class="bp ' + bpc + '" title="素のBP ' + li.bp + '">' + (bpc === 'up' ? '▲' : bpc === 'dn' ? '▼' : '') + bp + '</span>' : '') : (li ? lvb : 'ネクサス');
  return '<div class="slot" data-slot="' + k.iid + '" data-own="' + (own ? 1 : 0) + '"><div class="sin' + (own ? '' : ' opp') + '">' + coresHTML(k.cores, 'card:' + k.iid, own) + '<div class="cardbox lvk' + kind + (k.asSp ? ' nxsp' : '') + (k.tapped ? ' tapped' : '') + (k.heavy ? ' heavy' : '') + (V.battle && V.battle.iid === k.iid ? ' atking' : '') + (V.battle && V.battle.blocker === k.iid ? ' blking' : '') + '"><div class="card' + artCls(k) + '" ' + cardAttr(k, own, 'field') + '>' + cardInner(d, low) + '</div></div></div></div>';
}
// 1人分の盤面。左列=ライフ/リザーブ、中央=フィールド、右列=デッキ/トラッシュ(相手側はCSSで上下左右を反転して対面にする)
function sideHTML(P, own) {
  const o = own ? 1 : 0, dz = own && sel.size && !pay ? ' drop' : '';
  const colA = '<div class="col ca">' +
    '<div class="zone"' + (own ? ' data-nodrop="life"' : '') + '><div class="zt">ライフ</div>' + lifeHTML(P.life, own) + '</div>' +
    '<div class="zone' + dz + '"' + (own ? ' data-dest="reserve"' : '') + '><div class="zt">リザーブ</div>' + coresHTML(P.reserve, 'reserve', own) + '</div></div>';
  const hold = millHold[own ? 'me' : 'opp'], TR = hold && Date.now() < hold.until ? P.trash.filter(k => !hold.ids.has(k.iid)) : P.trash;
  const top = TR.length ? TR[TR.length - 1] : null;
  const pile = top ? '<div class="pile"><div class="card tface' + artCls({ def: top.def }) + '" style="--cc:' + (COLOR_HEX[top.def.color] || '#6a7499') + (artOf(top.def.id) ? ';background-image:url(' + artOf(top.def.id) + ')' : '') + '">' + cardInner(top.def, '') + '</div><span class="pn">' + TR.length + '</span></div>' : '<div class="pile empty">なし</div>';
  const colB = '<div class="col cb">' +
    '<div class="deck"' + (own && V.test ? ' data-deck="1"' : '') + '><b>' + P.deckN + '</b><span>デッキ</span></div>' +
    '<div class="zone trash" data-list="trash" data-own="' + o + '" title="クリックで一覧"><div class="zt">トラッシュ</div>' + pile + '</div>' +
    '<div class="zsub cores' + dz + '"' + '><span>コア</span>' + coresHTML(P.coreTrash, 'coreTrash', own) + '</div>' +
    '<a class="lk rm" data-list="removed" data-own="' + o + '">除外 <b>' + P.removed.length + '</b></a></div>';
  // スピリットは上の段、ネクサスは下の段(相手側は上下が反転)。多いときは、段からはみ出して相手の領域に入ってよい
  const sp = P.field.filter(k => k.def.type === 'spirit'), nx = P.field.filter(k => k.def.type !== 'spirit');
  const field = '<div class="field"><div class="lane sp">' + sp.map(k => fieldCardHTML(k, own)).join('') + '</div><div class="lane nx">' + nx.map(k => fieldCardHTML(k, own)).join('') + '</div>' + '' + '</div>';
  return colA + field + colB;
}

/* --- コスト支払いモード(カードを出す・使う) --- */
function payState() {
  if (!pay || !V) return null;
  const k = V.you.hand.find(x => x.iid === pay.iid) || V.you.trash.find(x => x.iid === pay.iid); if (!k) return null;
  const d = k.def, info = payRequirement(V.you, d, { ex: pay.ex, soulMagic: pay.soulMagic, puppet: !!V.you.trash.find(x => x.iid === pay.iid) });

  const nPay = pay.pay.size, nPlace = pay.place.size;
  const cores = allCores(V.you), isSoul = id => { const c = cores.find(x => x.id === id); return !!(c && c.soul); };
  let payOk = info.ok && nPay === need;

  if (t.closest('[data-switch]')) { viewer = 1 - viewer; sel.clear(); pay = null; pushState(); return; }
  const lm = t.closest('[data-lmode]');
  if (lm) { listMode = lm.dataset.lmode; openList(lm.dataset.lwho === '1', lm.dataset.lzone); return; }
  const lk = t.closest('[data-list]');
  if (lk) { openList(lk.dataset.own === '1', lk.dataset.list); return; }
  const card = t.closest('[data-card]');
  if (card) {
    if (card.dataset.zone === 'deck') { openDeckCard(card.dataset.card); return; }
    if (pay) { if (t.closest('#mat')) cancelPay(); return; }
    const cid = card.dataset.card;
    if (glowOf(cid)) {
      if (V.usable.hand.includes(cid) && card.dataset.zone === 'hand') { startPay(cid); return; }
      const pdn = V.pending && V.pending.pi === V.me ? Math.min(V.pending.n, V.pending.cands.length) : 0;
      if (pdn || V.usable.block.includes(cid)) {
        if (pickSel.has(cid)) pickSel.delete(cid); else { if (!pdn) pickSel.clear(); if (pdn && pickSel.size >= pdn) pickSel.delete([...pickSel][0]); pickSel.add(cid); }
        render(); return;
      }
    }
    if (sel.size && !camoMode() && card.dataset.own === '1' && card.dataset.zone === 'field') { moveCoresGuarded([...sel], { zone: 'card', iid: card.dataset.card }); sel.clear(); return; }
    openCard(card.dataset.card); return;
  }
  if (pay && t.closest('#mat') && !t.closest('[data-dest]')) { cancelPay(); return; }
  const dest = t.closest('[data-dest]');
  if (dest && sel.size && !camoMode()) { moveCoresGuarded([...sel], { zone: dest.dataset.dest }); sel.clear(); return; }
}
document.addEventListener('click', e => {
  // ドロップの直後(30ms以内)に出るクリックは、ドラッグ操作そのものが生むものなので無視する
  if (dragEndT >= 0 && e.timeStamp - dragEndT < 30) { dragEndT = -1; return; }
  const cleared = clearOnOutside(e.target);
  handleClick(e.target);
  if (cleared) render();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('sheet').hidden) { hideSheet(); return; }
  if (pay) { cancelPay(); return; }
  if (sel.size) { sel.clear(); render(); }
});

/* --- ドラッグ&ドロップ(マウス・タッチ共通) --- */
// 手札のカード → 自分の盤面で「召喚・使用」/ トラッシュへ
// コア → 自分のリザーブ・トラッシュ・ボイド・場のカード(ライフには置けない)
// 場のカード → トラッシュ / 手札へ
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('pointerdown', e => {
  if (!V || !$('sheet').hidden || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const el = e.target.closest('[data-card],[data-cc],[data-core]');
  if (!el || el.dataset.own !== '1') return;
  let d = null;
  if (pay) {
    if (el.dataset.card) return;
    d = { kind: 'paycore', loc: el.dataset.loc || el.dataset.cc, soulId: el.dataset.core || null, soul: !!el.dataset.soul };
  } else if (el.dataset.card) {
    const z = el.dataset.zone; if (z !== 'hand' && z !== 'field') return;
    if (z === 'field' && !V.test) return;
    d = { kind: z, iid: el.dataset.card };
  } else if (el.dataset.core) {
    if (!canMoveCores()) return;
    const id = el.dataset.core;
    d = { kind: 'core', ids: sel.has(id) ? [...sel] : [id], single: 'soul' };
  } else {
    if (!canMoveCores()) return;
    const list = coresAt(el.dataset.cc).filter(c => !c.soul);
    if (!list.length) return;
    const hit = sel.size && list.some(c => sel.has(c.id));
    d = { kind: 'core', ids: hit ? [...sel] : [list[0].id] };
  }
  Object.assign(d, { el, sx: e.clientX, sy: e.clientY, started: false, ghost: null, hot: null, marks: [] });
  drag = d;
});
function dragTargets(d) {
  if (d.kind === 'paycore') return [...document.querySelectorAll('[data-pzone]')];
  if (d.kind === 'core') return [...document.querySelectorAll('#me [data-dest],#me [data-slot]')];
  if (d.kind === 'hand') return [...document.querySelectorAll(V.test ? '#me .field,#me .trash' : '#me .field')];
  return [...document.querySelectorAll('#me .trash,#hand')];
}
function targetAt(x, y, d) {
  for (const el of document.elementsFromPoint(x, y)) {
    if (!el.closest) continue;
    if (d.kind === 'paycore') { const z = el.closest('[data-pzone]'); if (z) return { type: 'pz', b: z.dataset.pzone, el: z }; continue; }
    if (d.kind === 'core') {
      const z = el.closest('#me [data-dest]'); if (z) return { type: 'zone', zone: z.dataset.dest, el: z };
      const s = el.closest('#me [data-slot]'); if (s) return { type: 'card', iid: s.dataset.slot, el: s };
      const nd = el.closest('#me [data-nodrop]'); if (nd) return { type: 'nodrop', el: nd };
    } else {
      const tr = el.closest('#me .trash'); if (tr) return { type: 'trash', el: tr };
      if (d.kind === 'hand' && el.closest('#me')) return { type: 'cast', el: $('me').querySelector('.field') };
      if (d.kind === 'field' && el.closest('#hand')) return { type: 'hand', el: $('hand') };
    }
  }
  return null;
}
function startDrag(d) {
  d.started = true;
  const g = document.createElement('div'); g.className = 'ghost';
  if (d.kind === 'paycore') {
    g.innerHTML = '<span class="' + (d.soul ? 'core' : 'cc') + '">' + (d.soul ? '★' : '1') + '</span>';
  } else if (d.kind === 'core') {
    const soul = d.ids.length === 1 && d.el.dataset.soul;
    g.innerHTML = '<span class="' + (soul ? 'core' : 'cc') + '">' + (soul ? '★' : d.ids.length) + '</span>';
  } else { const c = d.el.cloneNode(true); c.style.transform = 'none'; c.style.position = 'relative'; g.appendChild(c); }
  document.body.appendChild(g); d.ghost = g;
  document.body.classList.add('dragging');
  d.marks = dragTargets(d); d.marks.forEach(m => m.classList.add('tgt'));
}
function endDrag(d) {
  if (d.ghost) d.ghost.remove();
  document.body.classList.remove('dragging');
  d.marks.forEach(m => m.classList.remove('tgt', 'hot'));
}
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const d = drag;
  if (!d.started) {
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if (Math.hypot(dx, dy) < 7) return;
    // 手札を指で横になぞったときは、手札の横スクロールとして扱う(上下に動かしたときだけドラッグ)
    if (d.kind === 'hand' && e.pointerType !== 'mouse' && Math.abs(dx) > Math.abs(dy) * 1.2) d.scrolling = true;
    if (!d.scrolling) startDrag(d);
  }
  if (d.scrolling) { const hr = document.querySelector('.handrow'); if (hr) { hr.scrollLeft -= e.clientX - (d.lx === undefined ? d.sx : d.lx); } d.lx = e.clientX; return; }
  d.ghost.style.left = e.clientX + 'px'; d.ghost.style.top = e.clientY + 'px';
  const t = targetAt(e.clientX, e.clientY, d);
  d.marks.forEach(m => m.classList.remove('hot'));
  if (t && t.type !== 'nodrop' && t.el) t.el.classList.add('hot');
});
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.started) { if (d.scrolling) dragEndT = e.timeStamp; return; }
  const t = targetAt(e.clientX, e.clientY, d);
  endDrag(d);
  dragEndT = e.timeStamp;
  if (!t) return;
  if (d.kind === 'paycore') { if (t.type === 'pz') payAdd(t.b, d.loc, d.soulId); }
  else if (d.kind === 'core') {
    if (t.type === 'nodrop') { return; }
    moveCoresGuarded(d.ids, t.type === 'zone' ? { zone: t.zone } : { zone: 'card', iid: t.iid });
    sel.clear(); render();
  } else if (d.kind === 'hand') {
    if (t.type === 'cast') startPay(d.iid); else if (t.type === 'trash') doAct({ k: 'moveCard', iid: d.iid, to: 'trash' });
  } else {
    if (t.type === 'trash') doAct({ k: 'moveCard', iid: d.iid, to: 'trash' }); else if (t.type === 'hand') doAct({ k: 'moveCard', iid: d.iid, to: 'hand' });
  }
});
document.addEventListener('pointercancel', () => { if (drag) { const d = drag; drag = null; if (d.started) endDrag(d); } });
{ const upd = () => { const r = document.documentElement.style; r.setProperty('--sideh', ($('side').offsetHeight + 4) + 'px'); r.setProperty('--handh', ($('hand').offsetHeight + 6) + 'px'); };
  if (window.ResizeObserver) { const ro = new ResizeObserver(upd); ro.observe($('side')); ro.observe($('hand')); } }
/* 開発者モード(パスは gateopen。ソースコードは公開されているので、鍵としては飾りです) */
const DEV_PASS = 'gateopen';
let DEV = false;
function setDev(on) { DEV = on; document.body.classList.toggle('dev', on); $('devOff').hidden = on; $('devOn').hidden = !on; try { localStorage.setItem('bs-dev', on ? '1' : ''); } catch (e) { } }
$('devGo').onclick = () => { if ($('devPass').value === DEV_PASS) { $('devPass').value = ''; setDev(true); } else { $('devPass').value = ''; $('devPass').placeholder = '違います'; } };
$('devPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('devGo').click(); });
$('devEnd').onclick = () => setDev(false);
setDev(true);   // 誰でも開ける(パスなし)
/* カードタイルの行の高さ(縦横比1:1.4)を列幅から決める */
function fixRows(el) {
  const cols = getComputedStyle(el).gridTemplateColumns.split(' ').map(parseFloat).filter(x => x > 0);
  if (cols.length) el.style.gridAutoRows = Math.round(cols[0] * 1.4) + 'px';
}
['bGrid', 'bList', 'lobbyDeckList'].forEach(id => { const el = $(id); if (!el) return; const f = () => fixRows(el); new ResizeObserver(f).observe(el); new MutationObserver(f).observe(el, { childList: true }); f(); });
rebuildCards(); bRefreshSelects();
if (!$('lobbyDeck').value && $('lobbyDeck').options.length > 1) { $('lobbyDeck').selectedIndex = 1; try { lobbyApply($('lobbyDeck').value); } catch (e) { } }
loadPacks().then(() => { bRefreshSelects(); if (!$('builder').hidden) bRender(); });
if ($('lobbyDeck').value) lobbyApply($('lobbyDeck').value);
